<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOJAK Memes — Community Wall</title>
<meta name="description" content="Upload and share MOJAK memes. Anyone with the link can post." />
<link rel="icon" href="/assets/feels/sending.png" />
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0614;--panel:#160c28;--panel2:#1d1136;--ink:#f3ecff;--dim:#9b86c9;--mojak:#9d4dff;--violet:#b985ff;--hot:#ff48c4;--acid:#c6ff4d;--line:rgba(157,77,255,.25);--disp:'Boogaloo',cursive;--body:'Outfit',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(11,6,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1100px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--disp);font-size:26px;color:var(--violet);display:flex;gap:8px;align-items:center}
.logo img{width:32px;height:32px}
.btn{border:none;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;font-family:var(--body);font-size:14px}
.btn-p{background:linear-gradient(100deg,#7b2dff,var(--mojak),var(--hot));color:#fff}
.btn-s{background:var(--panel2);color:#fff;border:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.hero{text-align:center;padding:54px 0 26px}
.hero h1{font-family:var(--disp);font-size:clamp(46px,9vw,88px);transform:rotate(-2deg);text-shadow:5px 5px 0 var(--mojak)}
.hero p{color:var(--dim);margin-top:6px}
.drop{border:2px dashed var(--line);border-radius:20px;padding:34px;text-align:center;margin:24px auto;max-width:560px;cursor:pointer;transition:.2s;background:var(--panel)}
.drop:hover,.drop.over{border-color:var(--mojak);background:rgba(157,77,255,.08)}
.drop .big{font-family:var(--disp);font-size:28px;color:var(--violet)}
.drop .sm{color:var(--dim);font-size:13px;margin-top:6px}
#cap{width:100%;max-width:560px;margin:0 auto 8px;display:block;padding:11px 14px;background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:12px;font-family:var(--body)}
.gate{max-width:560px;margin:24px auto;padding:28px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.gate .big{font-family:var(--disp);font-size:26px;color:var(--violet)}
#code{width:220px;max-width:80%;margin:14px auto 12px;display:block;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:12px;text-align:center;font-size:20px;letter-spacing:4px;font-family:var(--body)}
.gmsg{color:#ff7a9c;font-size:13px;min-height:16px;margin-top:8px}
.bar{max-width:560px;margin:0 auto;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mojak),var(--hot));transition:width .2s}
.msg{text-align:center;color:var(--acid);min-height:20px;margin:10px 0;font-size:14px}
.count{text-align:center;color:var(--dim);font-size:13px;margin:8px 0 18px}
.grid{column-count:4;column-gap:14px;padding-bottom:60px}
@media(max-width:980px){.grid{column-count:3}}
@media(max-width:680px){.grid{column-count:2}}
.card{break-inside:avoid;margin-bottom:14px;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);position:relative}
.card img,.card video{width:100%;display:block}
.card .cap{padding:8px 10px;font-size:13px;color:var(--dim)}
.card .dl{position:absolute;top:8px;right:8px;background:rgba(11,6,20,.7);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;opacity:0;transition:.2s}
.card:hover .dl{opacity:1}
.empty{text-align:center;color:var(--dim);padding:50px 0}
.lb{position:fixed;inset:0;background:rgba(5,2,12,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.lb.on{display:flex}
.lb img,.lb video{max-width:92vw;max-height:88vh;border-radius:12px}
.adm{position:absolute;top:8px;left:8px;background:rgba(255,72,196,.85);border:none;color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;display:none}
body.admin .adm{display:block}
.setup{max-width:620px;margin:30px auto;padding:18px;border:1px solid var(--hot);border-radius:14px;background:rgba(255,72,196,.07);color:#ffd6f0;font-size:13px;line-height:1.6;display:none}
.setup.on{display:block}
.setup code{background:#000;padding:1px 5px;border-radius:4px;color:var(--acid)}
</style>
</head>
<body>
<header><div class="nav">
  <a class="logo" href="/"><img src="/assets/feels/sending.png"/>MOJAK MEMES</a>
  <a class="btn btn-s" href="/">← Back to site</a>
</div></header>

<div class="hero">
  <h1>MEME WALL</h1>
  <p>Drop a MOJAK meme. Anyone with this link can post. Keep it purple.</p>
</div>

<div class="setup" id="setup"></div>

<div class="gate" id="gate">
  <div class="big">🔒 Upload code required</div>
  <div style="color:var(--dim);font-size:13px;margin-top:4px">Got the code from the team? Enter it to post.</div>
  <input id="code" type="text" inputmode="numeric" autocomplete="off" placeholder="• • • •"/>
  <button class="btn btn-p" id="unlock">Unlock uploading</button>
  <div class="gmsg" id="gmsg"></div>
</div>
<div id="uploader" style="display:none">
  <input id="cap" maxlength="80" placeholder="caption (optional)…"/>
  <div class="drop" id="drop">
    <div class="big">📁 Upload a meme</div>
    <div class="sm">images or short clips · up to 12MB · click or drag &amp; drop</div>
    <input type="file" id="file" accept="image/*,video/mp4,video/webm" multiple style="display:none"/>
  </div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
</div>
<div class="msg" id="msg"></div>
<div class="count" id="count"></div>

<div class="wrap"><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none">No memes yet — be the first anon. 🟣</div></div>

<div class="lb" id="lb"></div>

<script>
/* ─── CONFIG ─── swap these two for a dedicated MOJAK Supabase project if you don't want to reuse the existing one */
var SUPA_URL='https://cuqhqcmrgpdjlhyqztnc.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1cWhxY21yZ3BkamxoeXF6dG5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMjQ4NDAsImV4cCI6MjA5MjgwMDg0MH0.bsmuC_onaPutZmYZWTn9p1DvngKIA7Xx4J3YRajbf-8';
var BUCKET='mojak-memes';
var TABLE='mojak_memes';
var MAX_MB=12;
/* upload gate: share this code with trusted people. soft (client-side) gate. */
var UPLOAD_CODE='1077';
/* admin: open /gallery?admin=YOURSECRET to reveal hide buttons. set this to a secret you keep. */
var ADMIN_SECRET='mojakking';
/* ────────────── */

var $=function(i){return document.getElementById(i);};
var sb=(SUPA_URL&&SUPA_KEY)?supabase.createClient(SUPA_URL,SUPA_KEY):null;
var isAdmin=new URLSearchParams(location.search).get('admin')===ADMIN_SECRET;
if(isAdmin)document.body.classList.add('admin');

function setMsg(t,err){var m=$('msg');m.textContent=t;m.style.color=err?'#ff7a9c':'var(--acid)';}

if(!sb){$('setup').classList.add('on');$('setup').innerHTML='⚠️ Storage not configured. Set <code>SUPA_URL</code> and <code>SUPA_KEY</code> at the top of the gallery script, run the SQL, and create a public bucket named <code>'+BUCKET+'</code>.';}

/* downscale images client-side to <=1280px before upload (videos uploaded as-is) */
function processFile(file){return new Promise(function(res){
  if(!file.type.startsWith('image/'))return res(file);
  var img=new Image();img.onload=function(){
    var max=1280,s=Math.min(1,max/Math.max(img.width,img.height));
    if(s>=1)return res(file);
    var c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(b){res(new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}));},'image/jpeg',0.88);
  };img.src=URL.createObjectURL(file);
});}

async function uploadOne(file){
  if(file.size>MAX_MB*1024*1024){setMsg(file.name+' is over '+MAX_MB+'MB',true);return false;}
  var f=await processFile(file);
  var ext=(f.type.indexOf('video')>=0)?(f.name.split('.').pop()||'mp4'):'jpg';
  var path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  var up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});
  if(up.error){setMsg('upload failed: '+up.error.message,true);return false;}
  var pub=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  var ins=await sb.from(TABLE).insert({url:pub,type:f.type.indexOf('video')>=0?'video':'image',caption:$('cap').value.slice(0,80)||null});
  if(ins.error){setMsg('saved file but index failed: '+ins.error.message,true);return false;}
  return true;
}

async function handleFiles(list){
  if(!sb){setMsg('storage not set up yet',true);return;}
  var files=[].slice.call(list);if(!files.length)return;
  $('bar').style.display='block';var done=0,ok=0;
  for(var i=0;i<files.length;i++){var r=await uploadOne(files[i]);if(r)ok++;done++;$('barfill').style.width=Math.round(done/files.length*100)+'%';}
  $('bar').style.display='none';$('barfill').style.width='0';$('cap').value='';
  setMsg(ok?('posted '+ok+' meme'+(ok>1?'s':'')+' 🟣'):'nothing posted',!ok);
  load();
}

/* wiring */
$('drop').onclick=function(){$('file').click();};
$('file').onchange=function(e){handleFiles(e.target.files);};
['dragover','dragenter'].forEach(function(ev){$('drop').addEventListener(ev,function(e){e.preventDefault();$('drop').classList.add('over');});});
['dragleave','drop'].forEach(function(ev){$('drop').addEventListener(ev,function(e){e.preventDefault();$('drop').classList.remove('over');});});
$('drop').addEventListener('drop',function(e){if(e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);});

/* gate wiring */
function unlockUploader(){$('gate').style.display='none';$('uploader').style.display='block';}
if(sessionStorage.getItem('mojak_up')==='1')unlockUploader();
$('unlock').onclick=function(){if($('code').value.trim()===UPLOAD_CODE){sessionStorage.setItem('mojak_up','1');unlockUploader();$('gmsg').textContent='';}else{$('gmsg').textContent='wrong code — ask the team';}};
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')$('unlock').click();});

function openLb(html){$('lb').innerHTML=html;$('lb').classList.add('on');}
$('lb').onclick=function(){this.classList.remove('on');this.innerHTML='';};

async function hideRow(id){if(!confirm('Hide this meme?'))return;await sb.from(TABLE).update({hidden:true}).eq('id',id);load();}
window.hideRow=hideRow;
function dl(url){var a=document.createElement('a');a.href=url;a.download='mojak-meme';a.target='_blank';a.click();}
window.dl=dl;

async function load(){
  if(!sb){$('empty').style.display='block';return;}
  var q=await sb.from(TABLE).select('*').eq('hidden',false).order('created_at',{ascending:false}).limit(300);
  var rows=q.data||[];var g=$('grid');g.innerHTML='';
  $('count').textContent=rows.length?(rows.length+' memes on the wall'):'';
  $('empty').style.display=rows.length?'none':'block';
  rows.forEach(function(r){
    var d=document.createElement('div');d.className='card';
    var media=r.type==='video'?'<video src="'+r.url+'" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>':'<img src="'+r.url+'" loading="lazy"/>';
    d.innerHTML=media+(r.caption?'<div class="cap">'+r.caption.replace(/</g,'&lt;')+'</div>':'')+
      '<button class="dl" onclick="event.stopPropagation();dl(\''+r.url+'\')">⬇</button>'+
      (isAdmin?'<button class="adm" onclick="event.stopPropagation();hideRow(\''+r.id+'\')">hide</button>':'');
    d.onclick=function(){openLb(r.type==='video'?'<video src="'+r.url+'" controls autoplay loop></video>':'<img src="'+r.url+'"/>');};
    g.appendChild(d);
  });
}
load();
</script>
</body>
</html>
